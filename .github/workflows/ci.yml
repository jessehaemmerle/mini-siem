name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t mini-siem:ci .
      - name: Container starten und prüfen
        run: |
          docker run -d --name siem -p 8080:8080 -e SIEM_ADMIN_PASSWORD=ci-passwort-123 mini-siem:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/health; then exit 0; fi
            sleep 1
          done
          docker logs siem
          exit 1
