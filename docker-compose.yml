# Mini-SIEM starten:   docker compose up -d
# Logs ansehen:        docker compose logs -f
# Aktualisieren:       git pull && docker compose up -d --build
# Sicherung:           docker compose exec siem python -m siem backup
services:
  siem:
    build: .
    image: mini-siem:latest
    container_name: mini-siem
    restart: unless-stopped
    ports:
      - "8080:8080"         # Weboberfläche und HTTP-Ingest
      - "514:1514/udp"      # Syslog UDP
      - "514:1514/tcp"      # Syslog TCP
    environment:
      TZ: ${TZ:-Europe/Vienna}
      SIEM_ADMIN_USER: ${SIEM_ADMIN_USER:-admin}
      SIEM_ADMIN_PASSWORD: ${SIEM_ADMIN_PASSWORD:-}
      SIEM_RETENTION_DAYS: ${SIEM_RETENTION_DAYS:-90}
      SIEM_SYSLOG_ALLOW: ${SIEM_SYSLOG_ALLOW:-}
      SIEM_COOKIE_SECURE: ${SIEM_COOKIE_SECURE:-false}
      SIEM_PUBLIC_SYSLOG_PORT: ${SIEM_PUBLIC_SYSLOG_PORT:-514}
      SIEM_TRUSTED_PROXIES: ${SIEM_TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - siem-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  siem-data:
